name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  # Supabase Free pauses projects after a week of inactivity. A lightweight
  # REST ping every 6 hours keeps Auth/Postgres/Edge Functions warm.
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  keep-supabase-awake:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_URL secret is not set; keep-alive skipped"
            exit 0
          fi
          curl -fsS "$SUPABASE_URL/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY:-}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY:-}" \
            > /dev/null
          echo "Supabase pinged successfully"

  build-apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.3.1'

      - name: Compute version
        id: version
        run: |
          CODE=$((1000 + ${{ github.run_number }}))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare debug keystore
        # All builds MUST use the same signing key, otherwise Android treats each
        # APK as a different app and updates fail with "package conflicts with
        # existing package". Never generate a random keystore here.
        run: |
          if [ ! -s debug.keystore.base64 ]; then
            echo "::error::debug.keystore.base64 is missing - cannot sign APK consistently"
            exit 1
          fi
          base64 -d debug.keystore.base64 > debug.keystore

      - name: Configure Supabase for the APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL/SUPABASE_ANON_KEY secrets are not set; APK will use the public demo fallback"
            exit 0
          fi
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          } > .env
          echo "Wrote gitignored .env for this build"

      - name: Build Debug APK
        env:
          BUILD_VERSION_CODE: ${{ steps.version.outputs.code }}
          BUILD_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v7.0.2
        with:
          name: clips-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Check APK size before publishing
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          MAX_BYTES=$((100 * 1024 * 1024))
          APK_BYTES=$(stat -c%s "$APK")
          APK_MB=$(awk -v bytes="$APK_BYTES" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')
          echo "APK size: ${APK_MB} MiB ($APK_BYTES bytes); limit: 100 MiB"
          if [ "$APK_BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error::APK is ${APK_MB} MiB, above GitHub's 100 MiB file limit. The APK artifact 'clips-debug-apk' is still available, but publishing to app-debug.apk in clips-updates was skipped. Reduce native ABI filters or publish the APK as a GitHub Release asset."
            exit 1
          fi

      # The app repository stays private. Only the APK + update.json are
      # mirrored to a small public repo that the app can read anonymously.
      - name: Publish APK + update.json to public updates repo
        env:
          UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$UPDATES_TOKEN" ]; then
            echo "::warning::UPDATES_TOKEN secret is not set; skipping public update publish"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${UPDATES_TOKEN}@github.com/tpvkeov/clips-updates.git" updates-repo
          cp app/build/outputs/apk/debug/app-debug.apk updates-repo/app-debug.apk
          # Mirror the unified SQL and Edge Functions so the public raw links
          # always match the app.
          cp supabase/master_setup.sql updates-repo/master_setup.sql
          mkdir -p updates-repo/functions
          cp -r supabase/functions/. updates-repo/functions/
          cat > updates-repo/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://raw.githubusercontent.com/tpvkeov/clips-updates/main/app-debug.apk",
            "notes": "تحديث جديد من GitHub Actions ($COMMIT_SHA)",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cd updates-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-debug.apk update.json master_setup.sql functions
          if ! git diff --cached --quiet; then
            git commit -m "Publish update ${VERSION_NAME}"
            git push
          else
            echo "No changes to publish"
          fi
